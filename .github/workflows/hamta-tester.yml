name: Hämta vallatester från forum

on:
  schedule:
    - cron: "17 4 * * 2,5"   # tisdagar och fredagar 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/kallor.json"
      - "scripts/hamta_tester.py"
      - ".github/workflows/hamta-tester.yml"

permissions:
  contents: write
  issues: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta och analysera
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python3 scripts/hamta_tester.py --dumpa utlast --nytt nytt.md
      - name: Visa utläst text i loggen (felsökning)
        if: always()
        run: |
          for f in utlast/*.txt; do
            [ -f "$f" ] || continue
            echo "=================== $f"
            head -c 6000 "$f"; echo
          done
      - name: Spara utläst text (felsökning)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: utlast-text
          path: utlast
          retention-days: 7
          if-no-files-found: ignore
      - name: Committa om något ändrats
        if: github.ref_name == github.event.repository.default_branch
        run: |
          if ! git diff --quiet data/forum.js; then
            git config user.name "vallaguiden-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/forum.js
            git commit -m "Uppdatera forumdata"
            git push
          fi
      - name: Avisera om nya vallatips
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ -s nytt.md ]; then
            cat nytt.md >> "$GITHUB_STEP_SUMMARY"
            gh issue create --repo "$REPO" --title "Nya vallatips $(date -u +%Y-%m-%d)" --body-file nytt.md
          else
            echo "Inga nya vallatips sedan förra körningen." >> "$GITHUB_STEP_SUMMARY"
          fi
