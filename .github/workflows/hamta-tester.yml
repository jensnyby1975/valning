name: Hämta vallatester från forum

on:
  schedule:
    - cron: "17 4 * * *"   # dagligen 04:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "scripts/kallor.json"
      - "scripts/hamta_tester.py"
      - ".github/workflows/hamta-tester.yml"

permissions:
  contents: write

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta och analysera
        run: python3 scripts/hamta_tester.py
      - name: Committa om något ändrats
        if: github.ref_name == github.event.repository.default_branch
        run: |
          if ! git diff --quiet data/forum.js; then
            git config user.name "vallaguiden-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/forum.js
            git commit -m "Uppdatera forumdata"
            git push
          fi
